<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FinanceOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:        #080b12;
  --bg1:       #0d1117;
  --bg2:       #111827;
  --bg3:       #1a2035;
  --border:    #1e2d45;
  --border2:   #263352;
  --text:      #e8edf5;
  --muted:     #5a6a85;
  --muted2:    #8899b0;
  --accent:    #4f8eff;
  --accent2:   #7b5ea7;
  --green:     #34d399;
  --red:       #f87171;
  --amber:     #fbbf24;
  --purple:    #a78bfa;
  --cyan:      #22d3ee;
  --pink:      #f472b6;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --r:         12px;
  --r2:        8px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:var(--font-body)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5) brightness(1.2)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── TABLE ── */
table{width:100%;border-collapse:separate;border-spacing:0 3px}
thead th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:600;padding:3px 14px;text-transform:uppercase;letter-spacing:.7px;font-family:var(--font-head)}
tbody tr{background:var(--bg2);transition:background .15s}
tbody tr:hover{background:var(--bg3)}
tbody td{padding:11px 14px;font-size:13px;color:var(--muted2);border-top:1px solid var(--bg);border-bottom:1px solid var(--bg)}
tbody td:first-child{border-left:1px solid var(--bg);border-radius:var(--r2) 0 0 var(--r2)}
tbody td:last-child{border-right:1px solid var(--bg);border-radius:0 var(--r2) var(--r2) 0}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-up{animation:fadeUp .35s ease both}
.fade-up:nth-child(1){animation-delay:.05s}
.fade-up:nth-child(2){animation-delay:.10s}
.fade-up:nth-child(3){animation-delay:.15s}
.fade-up:nth-child(4){animation-delay:.20s}
.fade-up:nth-child(5){animation-delay:.25s}

/* ── CHECKBOX ── */
.cb-wrap{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.cb-wrap input[type=checkbox]{display:none}
.cb-box{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);background:var(--bg1);display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.cb-wrap input:checked + .cb-box{background:var(--accent);border-color:var(--accent)}
.cb-wrap input:checked + .cb-box::after{content:'✓';font-size:11px;color:#fff;font-weight:700}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{background:var(--bg3);border:1px solid var(--border2);border-left:3px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:var(--r2);font-size:13px;font-weight:500;animation:fadeUp .25s ease;pointer-events:none}

/* ── GLOW EFFECTS ── */
.glow-g{box-shadow:0 0 20px #34d39915}
.glow-r{box-shadow:0 0 20px #f8717115}
.glow-a{box-shadow:0 0 20px #fbbf2415}
.glow-b{box-shadow:0 0 20px #4f8eff15}
.glow-p{box-shadow:0 0 20px #a78bfa15}
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px">
    <div style="font-size:32px">⚡</div>
    <div style="font-size:14px;color:var(--muted);font-family:var(--font-head)">Conectando ao Firebase…</div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
/* ══════════════ IMPORTS ══════════════ */
import { initializeApp }   from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAnalytics }    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
import { getFirestore, collection, doc, getDocs, addDoc, deleteDoc, updateDoc, serverTimestamp }
                           from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
                           from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
const R  = await import("https://esm.sh/react@18");
const RD = await import("https://esm.sh/react-dom@18/client");
const { useState, useEffect, useMemo, useCallback, useRef } = R;
const h  = R.default.createElement;

/* ══════════════ FIREBASE ══════════════ */
const app = initializeApp({
  apiKey:"AIzaSyC6YgEHAmNJO2WV_6C-p7WEP4RgftDBflI",
  authDomain:"dashboardb-5fef9.firebaseapp.com",
  projectId:"dashboardb-5fef9",
  storageBucket:"dashboardb-5fef9.firebasestorage.app",
  messagingSenderId:"501258050014",
  appId:"1:501258050014:web:2eda576283dd72e3dc254f",
  measurementId:"G-704K8FH0WP"
});
const db   = getFirestore(app);
const auth = getAuth(app);
getAnalytics(app);

const col    = n => collection(db,n);
const getAll = async n => (await getDocs(col(n))).docs.map(d=>({id:d.id,...d.data()}));
const fadd   = (n,d)   => addDoc(col(n),{...d,_ts:serverTimestamp()});
const fdel   = (n,id)  => deleteDoc(doc(db,n,id));
const fpatch = (n,id,d)=> updateDoc(doc(db,n,id),d);

/* ══════════════ CONSTANTES ══════════════ */
const MESES  = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const CATS   = ["Cafeterias","Hardware/Periféricos","Jogos/Steam","Mensalidades","Mercado","Transporte","Saúde","Outros"];
const C_CLR  = {"Cafeterias":"#fbbf24","Hardware/Periféricos":"#4f8eff","Jogos/Steam":"#34d399","Mensalidades":"#22d3ee","Mercado":"#f472b6","Transporte":"#34d399","Saúde":"#f97316","Outros":"#a78bfa"};
const NOW    = new Date(), CY=NOW.getFullYear(), CM=NOW.getMonth();
const fmt    = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtN   = v => Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pdate  = s => { const [y,mo]=s.split("-").map(Number); return {year:y,month:mo-1}; };
const D      = (y,m,d) => new Date(y,m,d).toISOString().split("T")[0];
const uid    = () => `id_${Date.now()}_${Math.random().toString(36).slice(2)}`;

/* ══════════════ TOAST ══════════════ */
function showToast(msg,type="info"){
  const el=document.createElement("div");
  el.className="toast-item";
  const colors={info:"var(--accent)",success:"var(--green)",error:"var(--red)",warn:"var(--amber)"};
  el.style.borderLeftColor=colors[type]||colors.info;
  el.textContent=msg;
  document.getElementById("toast").appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

/* ══════════════ ESTILOS BASE ══════════════ */
const INP={width:"100%",background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:"var(--r2)",color:"var(--text)",padding:"8px 11px",fontSize:13,outline:"none",transition:"border-color .15s",fontFamily:"var(--font-body)"};
const INP_FOCUS={...INP,borderColor:"var(--accent)"};

function Input(props){
  const [foc,setFoc]=useState(false);
  return h("input",{...props,style:foc?INP_FOCUS:INP,onFocus:()=>setFoc(true),onBlur:()=>setFoc(false)});
}
function Sel({value,onChange,children,style:s}){
  return h("select",{value,onChange,style:{...INP,...s}},children);
}
function BigSel({value,onChange,options}){
  return h("div",{style:{position:"relative"}},
    h("select",{value,onChange:e=>onChange(typeof options[0]?.v==="number"?Number(e.target.value):e.target.value),style:{
      appearance:"none",background:"var(--bg2)",border:"1px solid var(--border)",
      color:"var(--text)",padding:"8px 28px 8px 12px",borderRadius:"var(--r2)",
      fontSize:13,cursor:"pointer",outline:"none",fontFamily:"var(--font-body)"
    }},options.map(o=>h("option",{key:o.v,value:o.v},o.l))),
    h("span",{style:{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",color:"var(--muted)",fontSize:9,pointerEvents:"none"}},"▼")
  );
}

/* ── Card base ── */
function Card({children,style:s,glow,onClick}){
  return h("div",{onClick,style:{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:20,...(glow?{boxShadow:`0 0 24px ${glow}18`}:{}),...s}},children);
}

/* ── Stat card ── */
function Stat({label,value,sub,accent,icon,delta,big}){
  const palettes={
    blue:  {bg:"linear-gradient(135deg,#0d1b35,#0d1117)",bdr:"#1e3a6e",val:"#4f8eff",icon:"#1e3a6e88",glow:"#4f8eff"},
    green: {bg:"linear-gradient(135deg,#062518,#0d1117)",bdr:"#0d4a30",val:"#34d399",icon:"#0d4a3088",glow:"#34d399"},
    red:   {bg:"linear-gradient(135deg,#250d0d,#0d1117)",bdr:"#5a1a1a",val:"#f87171",icon:"#5a1a1a88",glow:"#f87171"},
    amber: {bg:"linear-gradient(135deg,#251a05,#0d1117)",bdr:"#5a3d05",val:"#fbbf24",icon:"#5a3d0588",glow:"#fbbf24"},
    purple:{bg:"linear-gradient(135deg,#18102b,#0d1117)",bdr:"#3d2060",val:"#a78bfa",icon:"#3d206088",glow:"#a78bfa"},
    cyan:  {bg:"linear-gradient(135deg,#052025,#0d1117)",bdr:"#0a4050",val:"#22d3ee",icon:"#0a405088",glow:"#22d3ee"},
  };
  const p=palettes[accent]||palettes.blue;
  return h("div",{style:{background:p.bg,border:`1px solid ${p.bdr}`,borderRadius:"var(--r)",padding:big?"20px 22px":"16px 18px",boxShadow:`0 0 30px ${p.glow}10`,position:"relative",overflow:"hidden"}},
    h("div",{style:{position:"absolute",right:16,top:16,fontSize:22,opacity:.15}},icon),
    h("div",{style:{fontSize:10.5,color:"var(--muted)",fontWeight:600,textTransform:"uppercase",letterSpacing:".8px",marginBottom:8,fontFamily:"var(--font-head)"}},label),
    h("div",{style:{fontSize:big?28:22,fontWeight:800,color:p.val,letterSpacing:"-1px",fontFamily:"var(--font-head)",lineHeight:1}},value),
    sub&&h("div",{style:{fontSize:11,color:"var(--muted)",marginTop:6}},sub),
    delta!=null&&h("div",{style:{fontSize:11,marginTop:5,color:delta>=0?"var(--green)":"var(--red)",fontWeight:600}},delta>=0?`▲ +${fmtN(delta)}`:`▼ ${fmtN(Math.abs(delta))}`)
  );
}

/* ── Form field ── */
function FF({label,children,col:c}){
  return h("div",{style:c?{gridColumn:c}:{}},
    h("label",{style:{display:"block",fontSize:10.5,color:"var(--muted)",fontWeight:600,marginBottom:5,textTransform:"uppercase",letterSpacing:".6px",fontFamily:"var(--font-head)"}}},label),
    children
  );
}

/* ── Badge ── */
function Badge({text,color}){
  return h("span",{style:{background:`${color}18`,color,borderRadius:5,padding:"2px 8px",fontSize:11,fontWeight:600,border:`1px solid ${color}30`}},text);
}

/* ── Status toggle ── */
function StatusBtn({pago,onClick}){
  return h("button",{onClick,style:{
    display:"inline-flex",alignItems:"center",gap:5,border:`1px solid ${pago?"#0d4a30":"#5a3d05"}`,
    background:pago?"#062518":"#251a05",color:pago?"#34d399":"#fbbf24",
    borderRadius:"var(--r2)",padding:"5px 11px",fontSize:12,fontWeight:600,cursor:"pointer",
    transition:"all .15s",fontFamily:"var(--font-body)"
  }},pago?"✓ Pago":"⏳ Pendente");
}

/* ── Del button ── */
function DelBtn({onClick}){
  return h("button",{onClick,style:{background:"none",border:"1px solid transparent",cursor:"pointer",color:"var(--muted)",padding:"4px 7px",borderRadius:6,fontSize:13,transition:"all .15s",lineHeight:1},
    onMouseEnter:e=>{e.target.style.borderColor="var(--red)30";e.target.style.color="var(--red)"},
    onMouseLeave:e=>{e.target.style.borderColor="transparent";e.target.style.color="var(--muted)"}
  },"✕");
}

/* ── Empty state ── */
function Empty({msg}){
  return h("div",{style:{textAlign:"center",padding:"44px 0",color:"var(--muted)"}},
    h("div",{style:{fontSize:30,marginBottom:10,opacity:.3}},"📭"),
    h("div",{style:{fontSize:13}}),msg
  );
}

/* ── Section header ── */
function SH({title,right}){
  return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}},
    h("h2",{style:{fontSize:16,fontWeight:800,color:"var(--text)",fontFamily:"var(--font-head)",letterSpacing:"-.3px"}},title),
    right&&h("div",null,right)
  );
}

/* ── Pill button ── */
function Pill({onClick,children,active,color}){
  return h("button",{onClick,style:{
    display:"inline-flex",alignItems:"center",gap:6,
    background:active?"var(--accent)18":"var(--bg3)",
    border:`1px solid ${active?"var(--accent)":"var(--border)"}`,
    color:active?"var(--accent)":"var(--muted2)",
    borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer",
    transition:"all .15s",fontFamily:"var(--font-body)"
  }},children);
}

/* ── Bar chart ── */
function BarChart({data,height=120}){
  if(!data.length) return h(Empty,{msg:"Nenhum dado"});
  const max=Math.max(...data.map(d=>d.val),1);
  return h("div",{style:{display:"flex",alignItems:"flex-end",gap:6,height,paddingTop:8}},
    data.map(({cat,val})=>h("div",{key:cat,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
      h("div",{style:{fontSize:10,color:"var(--muted)",fontWeight:500}}),
      h("div",{title:`${cat}: ${fmt(val)}`,style:{
        width:"100%",background:`linear-gradient(180deg,${C_CLR[cat]||"var(--accent)"},${C_CLR[cat]||"var(--accent)"}88)`,
        borderRadius:"4px 4px 0 0",height:`${Math.max((val/max)*100,4)}%`,
        transition:"height .4s ease",cursor:"default",
        boxShadow:`0 0 8px ${C_CLR[cat]||"var(--accent)"}40`
      }}),
      h("div",{style:{fontSize:9,color:"var(--muted)",textAlign:"center",lineHeight:1.2,maxWidth:40,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},cat.split("/")[0])
    ))
  );
}

/* ── Donut chart ── */
function Donut({data,size=110}){
  if(!data.length) return h(Empty,{msg:"Sem dados"});
  const total=data.reduce((s,d)=>s+d.val,0);
  if(!total) return h(Empty,{msg:"Sem dados"});
  const r=40,cx=55,cy=55,circ=2*Math.PI*r;
  let offset=0;
  const segs=data.map(({cat,val})=>{
    const pct=val/total,dash=pct*circ,gap=circ-dash;
    const seg={cat,val,pct,dash,gap,offset,color:C_CLR[cat]||"#4f8eff"};
    offset+=dash;
    return seg;
  });
  return h("div",{style:{display:"flex",gap:16,alignItems:"center"}},
    h("svg",{width:size,height:size,viewBox:"0 0 110 110"},
      h("circle",{cx,cy,r,fill:"none",stroke:"var(--bg1)",strokeWidth:14}),
      segs.map(s=>h("circle",{key:s.cat,cx,cy,r,fill:"none",stroke:s.color,strokeWidth:13,strokeDasharray:`${s.dash} ${s.gap}`,strokeDashoffset:-s.offset,style:{transition:"stroke-dasharray .5s ease"}})),
      h("text",{x:cx,y:cy+1,textAnchor:"middle",dominantBaseline:"middle",fill:"var(--text)",fontSize:12,fontWeight:700,fontFamily:"var(--font-head)"},fmt(total).replace("R$",""))
    ),
    h("div",{style:{flex:1,display:"flex",flexDirection:"column",gap:6}},
      segs.map(s=>h("div",{key:s.cat,style:{display:"flex",alignItems:"center",gap:7}},
        h("div",{style:{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}),
        h("span",{style:{fontSize:11,color:"var(--muted2)",flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},s.cat.split("/")[0]),
        h("span",{style:{fontSize:11,fontWeight:600,color:s.color,fontFamily:"var(--font-mono)"}}),`${Math.round(s.pct*100)}%`
      ))
    )
  );
}

/* ── Parcelamento row (usado em todas as abas) ── */
function ParcelaRow({form,setForm,show,label="Parcelar?"}){
  if(!show) return null;
  return h("div",{style:{display:"grid",gridTemplateColumns:"120px 120px",gap:10,marginTop:-4}},
    h(FF,{label:"Nº de Parcelas"},
      h(Input,{type:"number",value:form.parcelas||1,min:1,max:60,
        onChange:e=>setForm(f=>({...f,parcelas:parseInt(e.target.value)||1}))})
    ),
    h(FF,{label:"Data 1ª Parcela"},
      h(Input,{type:"date",value:form.dataInicio||D(CY,CM,1),
        onChange:e=>setForm(f=>({...f,dataInicio:e.target.value}))})
    )
  );
}

/* ════════════════════════════════════════════════
   ABA 0 — SALDO EM CONTA (Dashboard Principal)
   ════════════════════════════════════════════════ */
function SaldoTab({gastosMes,parcelasMes,rateioMes,comprasMes,fMes,fAno,saldos,onAddSaldo,onDelSaldo,onAddMov,onDelMov,movimentos}){
  const [showAddConta,setShowAddConta] = useState(false);
  const [showAddMov,setShowAddMov]     = useState(false);
  const [fConta,setFConta]             = useState({nome:"",banco:"",tipo:"corrente",saldoInicial:""});
  const [fMov,setFMov]                 = useState({contaId:"",tipo:"entrada",descricao:"",valor:"",data:D(CY,CM,NOW.getDate())});

  const totalSaldo     = saldos.reduce((s,c)=>s+c.saldoAtual,0);
  const movMes         = movimentos.filter(m=>{const d=pdate(m.data);return d.year===fAno&&d.month===fMes});
  const entradas       = movMes.filter(m=>m.tipo==="entrada").reduce((s,m)=>s+m.valor,0);
  const saidas         = movMes.filter(m=>m.tipo==="saida").reduce((s,m)=>s+m.valor,0);

  const totalGastosMes = gastosMes.reduce((s,g)=>s+g.valor,0)
                       + comprasMes.reduce((s,p)=>s+p.valorParcela,0)
                       + parcelasMes.filter(p=>p.pago).reduce((s,p)=>s+p.valorParcela,0)
                       + rateioMes.filter(r=>r.titular==="colega"&&r.status==="pago").reduce((s,r)=>s+r.valorTotal/2,0);
  const totalAReceber  = parcelasMes.filter(p=>!p.pago).reduce((s,p)=>s+p.valorParcela,0)
                       + rateioMes.filter(r=>r.titular==="eu"&&r.status==="pendente").reduce((s,r)=>s+r.valorTotal/2,0);

  const addConta = async()=>{
    if(!fConta.nome||!fConta.saldoInicial)return;
    const c={nome:fConta.nome,banco:fConta.banco,tipo:fConta.tipo,saldoInicial:parseFloat(fConta.saldoInicial),saldoAtual:parseFloat(fConta.saldoInicial)};
    await onAddSaldo(c);
    setFConta({nome:"",banco:"",tipo:"corrente",saldoInicial:""});
    setShowAddConta(false);
  };
  const addMov = async()=>{
    if(!fMov.contaId||!fMov.descricao||!fMov.valor)return;
    await onAddMov({...fMov,valor:parseFloat(fMov.valor)});
    setFMov(f=>({...f,descricao:"",valor:""}));
    setShowAddMov(false);
  };

  const ICONS_BANCO={nubank:"💜",inter:"🟠",bradesco:"🔴",itau:"🟡",santander:"🔴",caixa:"🔵",btg:"⚫",c6:"⚫",xp:"🟢"};
  const getIcon = nome=>ICONS_BANCO[nome.toLowerCase()]||"🏦";

  return h("div",{style:{animation:"fadeUp .3s ease"}},
    /* ── Big stats ── */
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:24}},
      h(Stat,{label:"Patrimônio Líquido",value:fmt(totalSaldo),sub:"soma de todas as contas",accent:"blue",icon:"💎",big:true}),
      h(Stat,{label:"Entradas no Mês",value:fmt(entradas),sub:`${MESES[fMes]} ${fAno}`,accent:"green",icon:"📈"}),
      h(Stat,{label:"Saídas no Mês",value:fmt(saidas),sub:"lançamentos manuais",accent:"red",icon:"📉"}),
      h(Stat,{label:"Gastos Calculados",value:fmt(totalGastosMes),sub:"de todas as abas",accent:"amber",icon:"🧮"}),
      h(Stat,{label:"A Receber",value:fmt(totalAReceber),sub:"parcelas + rateio",accent:"purple",icon:"⏳"}),
    ),

    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:24}},
      /* ── Contas ── */
      h(Card,{style:{gridColumn:"1"}},
        h(SH,{title:"Contas Cadastradas",right:h("div",{style:{display:"flex",gap:8}},
          h(Pill,{onClick:()=>{setShowAddConta(s=>!s);setShowAddMov(false)},active:showAddConta},"＋ Conta"),

/* ════════════════════════════════════════════════
   ABA 2 — MEUS GASTOS (com suporte a parcelamento)
   ════════════════════════════════════════════════ */
function GastosTab({gastosMes,comprasMes,fMes,fAno,onAddGasto,onDelGasto,onAddCompra,onDelCompra,totalGastos,totalCompras}){
  const [form,setForm] = useState({data:D(CY,CM,Math.min(NOW.getDate(),28)),descricao:"",valor:"",categoria:"Cafeterias",parcelado:false,parcelas:2,dataInicio:D(CY,CM,1)});
  const [busy,setBusy] = useState(false);
  const upd = k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  const submit = async()=>{
    if(!form.descricao.trim()||!form.valor)return;
    setBusy(true);
    if(form.parcelado&&form.parcelas>1){
      const d=pdate(form.dataInicio);
      await onAddCompra({descricao:form.descricao,valorTotal:parseFloat(form.valor)*form.parcelas,parcelas:form.parcelas,categoria:form.categoria,anoInicio:d.year,mesInicio:d.month});
    } else {
      await onAddGasto({data:form.data,descricao:form.descricao,valor:parseFloat(form.valor),categoria:form.categoria});
    }
    setForm(f=>({...f,descricao:"",valor:""}));
    setBusy(false);
  };

  const totalMes = totalGastos + totalCompras;

  return h("div",{style:{animation:"fadeUp .3s ease"}},
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}},
      h(Stat,{label:"Total do Mês",     value:fmt(totalMes),    sub:"gastos + parcelas",            accent:"red",   icon:"💸"}),
      h(Stat,{label:"Gastos Diretos",   value:fmt(totalGastos), sub:`${gastosMes.length} lançamentos`, accent:"amber", icon:"🧾"}),
      h(Stat,{label:"Compras Parceladas",value:fmt(totalCompras),sub:`${comprasMes.length} parc. este mês`, accent:"purple",icon:"💳"}),
    ),

    /* ── Formulário ── */
    h(Card,{style:{marginBottom:20}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"var(--accent)",marginBottom:16,textTransform:"uppercase",letterSpacing:".7px",fontFamily:"var(--font-head)"}},"Novo Lançamento"),
      h("div",{style:{display:"grid",gridTemplateColumns:"140px 1fr 130px 1fr",gap:10,marginBottom:12}},
        h(FF,{label:"Data"},         h(Input,{type:"date",value:form.data,onChange:upd("data")})),
        h(FF,{label:"Descrição"},     h(Input,{value:form.descricao,onChange:upd("descricao"),placeholder:"Ex: Café, Headset…"})),
        h(FF,{label:"Valor R$"},      h(Input,{type:"number",value:form.valor,onChange:upd("valor"),placeholder:form.parcelado?"Valor por parcela":"0,00",min:"0",step:"0.01"})),
        h(FF,{label:"Categoria"},     h(Sel,{value:form.categoria,onChange:upd("categoria")},CATS.map(c=>h("option",{key:c,value:c},c))))
      ),
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}},
        h("label",{className:"cb-wrap",style:{cursor:"pointer",userSelect:"none",display:"inline-flex",alignItems:"center",gap:8}},
          h("input",{type:"checkbox",checked:form.parcelado,onChange:e=>setForm(f=>({...f,parcelado:e.target.checked}))}),
          h("span",{className:"cb-box"}),
          h("span",{style:{fontSize:13,color:"var(--text)",fontWeight:500}}),"Compra parcelada"
        ),
        form.parcelado&&h("div",{style:{display:"flex",gap:10}},
          h(FF,{label:"Nº Parcelas"},h(Input,{type:"number",value:form.parcelas,min:2,max:60,onChange:e=>setForm(f=>({...f,parcelas:parseInt(e.target.value)||2})),style:{width:90}})),
          h(FF,{label:"1ª Parcela em"},h(Input,{type:"date",value:form.dataInicio,onChange:e=>setForm(f=>({...f,dataInicio:e.target.value})),style:{width:150}}))
        ),
        h("button",{onClick:submit,disabled:busy,style:{background:"var(--accent)",border:"none",color:"#fff",borderRadius:"var(--r2)",padding:"8px 20px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"var(--font-body)"}}},busy?"…":"Adicionar ＋")
      )
    ),

    /* ── Tabelas ── */
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
      h(Card,null,
        h(SH,{title:"Gastos Diretos"}),
        gastosMes.length===0 ? h(Empty,{msg:"Nenhum gasto direto"}) :
        h("table",null,
          h("thead",null,h("tr",null,["Data","Descrição","Cat","Valor",""].map(c=>h("th",{key:c},c)))),
          h("tbody",null,gastosMes.map(g=>h("tr",{key:g.id,className:"fade-up"},
            h("td",null,g.data.split("-").reverse().join("/")),
            h("td",{style:{color:"var(--text)",fontWeight:500}},g.descricao),
            h("td",null,h(Badge,{text:g.categoria.split("/")[0],color:C_CLR[g.categoria]||"#4f8eff"})),
            h("td",{style:{fontFamily:"var(--font-mono)",color:"var(--red)",fontWeight:600}},fmt(g.valor)),
            h("td",null,h(DelBtn,{onClick:()=>onDelGasto(g.id)}))
          )))
        )
      ),
      h(Card,null,
        h(SH,{title:`Parcelas em ${MESES[fMes]}`}),
        comprasMes.length===0 ? h(Empty,{msg:"Nenhuma parcela este mês"}) :
        h("table",null,
          h("thead",null,h("tr",null,["Produto","Cat","Parc","Valor",""].map(c=>h("th",{key:c},c)))),
          h("tbody",null,comprasMes.map(p=>h("tr",{key:p.id,className:"fade-up"},
            h("td",{style:{color:"var(--text)",fontWeight:500}},p.descricao),
            h("td",null,h(Badge,{text:p.categoria.split("/")[0],color:C_CLR[p.categoria]||"#4f8eff"})),
            h("td",{style:{color:"var(--muted)",fontSize:12}},`${p.numParcela}/${p.parcelas}`),
            h("td",{style:{fontFamily:"var(--font-mono)",color:"var(--red)",fontWeight:600}},fmt(p.valorParcela)),
            h("td",null,h(DelBtn,{onClick:()=>onDelCompra(p.id)}))
          )))
        )
      )
    )
  );
}

    if(!form.amigo.trim()||!form.descricao.trim()||!form.valor)return;
    const d=pdate(form.dataInicio);

      h(Stat,{label:"Já Recebido",      value:fmt(pago),      sub:"amigos que pagaram",            accent:"green",  icon:"✅"}),
      h(Stat,{label:"Pendente",         value:fmt(pend),      sub:"aguardando pagamento",          accent:"amber",  icon:"⏳"}),
    ),
    h(Card,{style:{marginBottom:20}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:show?16:0}},

          h(FF,{label:"Produto/Serviço"}, h(Input,{value:form.descricao,onChange:upd("descricao"),placeholder:"Ex: Notebook"})),

            h("input",{type:"checkbox",checked:form.parcelado,onChange:e=>setForm(f=>({...f,parcelado:e.target.checked}))}),
            h("span",{className:"cb-box"}),
            h("span",{style:{fontSize:13,color:"var(--text)",fontWeight:500}}),"Parcelar"
          ),
          form.parcelado&&h("div",{style:{display:"flex",gap:10}},
            h(FF,{label:"Parcelas"}, h(Input,{type:"number",value:form.parcelas,min:2,max:60,onChange:e=>setForm(f=>({...f,parcelas:parseInt(e.target.value)||2})),style:{width:90}})),

function RateioTab({rateioMes,fMes,fAno,onToggle,onAdd,onDel,aReceber,aPagar,gastoMeu}){
  const [show,setShow] = useState(false);
  const [form,setForm] = useState({descricao:"",valorTotal:"",titular:"eu",parcelado:false,parcelas:2,dataInicio:D(CY,CM,1)});
  const upd=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  const submit=async()=>{
    if(!form.descricao.trim()||!form.valorTotal)return;
    const d=pdate(form.dataInicio);
    const base={descricao:form.descricao,titular:form.titular,status:"pendente"};
    if(form.parcelado&&form.parcelas>1){
      const vlrParc=parseFloat(form.valorTotal);
      for(let i=0;i<form.parcelas;i++){
        const m=(d.month+i)%12, y=d.year+Math.floor((d.month+i)/12);
        await onAdd({...base,valorTotal:vlrParc*2,mes:m,ano:y});
      }
    } else {
      await onAdd({...base,valorTotal:parseFloat(form.valorTotal)*2,mes:fMes,ano:fAno});
    }
    setForm({descricao:"",valorTotal:"",titular:"eu",parcelado:false,parcelas:2,dataInicio:D(CY,CM,1)});
    setShow(false);
  };

  return h("div",{style:{animation:"fadeUp .3s ease"}},
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}},
      h(Stat,{label:"A Receber do Colega", value:fmt(aReceber), sub:"contas no seu nome",   accent:"green",  icon:"📥"}),
      h(Stat,{label:"Ainda Devo Pagar",    value:fmt(aPagar),   sub:"contas do colega",     accent:"amber",  icon:"📤"}),
      h(Stat,{label:"Já Paguei",           value:fmt(gastoMeu), sub:"minha parte quitada",  accent:"blue",   icon:"✅"}),
    ),
    h(Card,{style:{marginBottom:20}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:show?16:0}},
        h("div",{style:{fontSize:11,fontWeight:700,color:"var(--accent)",textTransform:"uppercase",letterSpacing:".7px",fontFamily:"var(--font-head)"}},"Nova Conta Compartilhada"),
        h(Pill,{onClick:()=>setShow(s=>!s),active:show},show?"✕ Fechar":"＋ Adicionar")
      ),
      show&&h("div",null,
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 150px 230px",gap:10,marginBottom:12}},
          h(FF,{label:"Descrição"},    h(Input,{value:form.descricao,onChange:upd("descricao"),placeholder:"Ex: Conta de Água"})),
          h(FF,{label:"Minha Parte R$"},h(Input,{type:"number",value:form.valorTotal,onChange:upd("valorTotal"),placeholder:"0,00",min:"0"})),
          h(FF,{label:"Titular"},      h(Sel,{value:form.titular,onChange:upd("titular")},
            h("option",{value:"eu"},"Eu — colega me paga metade"),
            h("option",{value:"colega"},"Colega — eu pago metade")
          ))
        ),
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}},
          h("label",{className:"cb-wrap",style:{cursor:"pointer",userSelect:"none",display:"inline-flex",alignItems:"center",gap:8}},
            h("input",{type:"checkbox",checked:form.parcelado,onChange:e=>setForm(f=>({...f,parcelado:e.target.checked}))}),
            h("span",{className:"cb-box"}),
            h("span",{style:{fontSize:13,color:"var(--text)",fontWeight:500}}),"Repetir por vários meses"
          ),
          form.parcelado&&h("div",{style:{display:"flex",gap:10}},
            h(FF,{label:"Qtd Meses"},   h(Input,{type:"number",value:form.parcelas,min:2,max:24,onChange:e=>setForm(f=>({...f,parcelas:parseInt(e.target.value)||2})),style:{width:100}})),
            h(FF,{label:"Mês Inicial"}, h(Input,{type:"date",value:form.dataInicio,onChange:e=>setForm(f=>({...f,dataInicio:e.target.value})),style:{width:150}}))
          ),
          h("button",{onClick:submit,style:{background:"var(--accent)",border:"none",color:"#fff",borderRadius:"var(--r2)",padding:"8px 20px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"var(--font-body)"}},"Salvar ＋")
        )
      )
    ),
    rateioMes.length===0
      ? h(Empty,{msg:`Nenhuma conta em ${MESES[fMes]}/${fAno}`})
      : h(Card,null,
        h("table",null,
          h("thead",null,h("tr",null,["Descrição","Total","Minha Parte","Titular","Situação","Status",""].map(c=>h("th",{key:c},c)))),
          h("tbody",null,rateioMes.map(r=>{
            const mp=r.valorTotal/2, meu=r.titular==="eu", pg=r.status==="pago";
            const sit=meu?(pg?"✅ Colega pagou":"⏳ Aguardando"):(pg?"✅ Você pagou":"❗ Pagar");
            const sitC=pg?"var(--green)":(meu?"var(--amber)":"var(--red)");
            return h("tr",{key:r.id,className:"fade-up"},
              h("td",{style:{color:"var(--text)",fontWeight:500}},r.descricao),
              h("td",{style:{color:"var(--muted)",fontFamily:"var(--font-mono)"}},fmt(r.valorTotal)),
              h("td",{style:{fontFamily:"var(--font-mono)",color:"var(--purple)",fontWeight:700}},fmt(mp)),
              h("td",null,h("span",{style:{background:meu?"#4f8eff18":"#22d3ee18",color:meu?"var(--accent)":"var(--cyan)",borderRadius:5,padding:"2px 8px",fontSize:11,fontWeight:700}},meu?"Eu":"Colega")),
              h("td",{style:{fontSize:12,color:sitC,fontWeight:600}},sit),
              h("td",null,h(StatusBtn,{pago:pg,onClick:()=>onToggle(r.id)})),
              h("td",null,h(DelBtn,{onClick:()=>onDel(r.id)}))
            );
          }))
        )
      )
  );
}

/* ════════════════════════════════════════════════
   APP PRINCIPAL
   ════════════════════════════════════════════════ */
function App(){
  const [tab,setTab]     = useState("saldo");
  const [fMes,setFMes]   = useState(CM);
  const [fAno,setFAno]   = useState(CY);
  const [loading,setLoad]= useState(true);

  const [gastos,  setGastos]   = useState([]);
  const [cartoes, setCartoes]  = useState([]);
  const [rateio,  setRateio]   = useState([]);
  const [compras, setCompras]  = useState([]);
  const [saldos,  setSaldos]   = useState([]);
  const [movs,    setMovs]     = useState([]);

  useEffect(()=>{
    (async()=>{
      try{
        const [g,c,r,cp,s,m]=await Promise.all([
          getAll("gastos"),getAll("cartoes"),getAll("rateio"),
          getAll("compras_proprias"),getAll("saldos"),getAll("movimentos")
        ]);
        setGastos(g);setCartoes(c);setRateio(r);setCompras(cp);setSaldos(s);setMovs(m);
        showToast("✓ Dados carregados","success");
      }catch(e){
        console.error(e);
        showToast("Erro ao conectar ao Firestore — verifique as regras de segurança","error");
      }
      setLoad(false);
    })();
  },[]);

  /* ── Derived ── */
  const gastosMes = useMemo(()=>gastos.filter(g=>{const{year,month}=pdate(g.data);return year===fAno&&month===fMes}),[gastos,fMes,fAno]);
  const totalGastosPessoais = useMemo(()=>gastosMes.reduce((s,g)=>s+g.valor,0),[gastosMes]);

  const parcelasMes = useMemo(()=>{
    const r=[];
    cartoes.forEach(c=>{
      const diff=(fAno-c.anoInicio)*12+(fMes-c.mesInicio), num=diff+1;
      if(num>=1&&num<=c.parcelas) r.push({...c,numParcela:num,valorParcela:c.valorTotal/c.parcelas,pago:(c.pagamentos||{})[num]===true});
    });
    return r;
  },[cartoes,fMes,fAno]);

  const comprasMes = useMemo(()=>{
    const r=[];
    compras.forEach(c=>{
      const diff=(fAno-c.anoInicio)*12+(fMes-c.mesInicio),num=diff+1;
      if(num>=1&&num<=c.parcelas) r.push({...c,numParcela:num,valorParcela:c.valorTotal/c.parcelas});
    });
    return r;
  },[compras,fMes,fAno]);

  const rateioMes = useMemo(()=>rateio.filter(r=>r.mes===fMes&&r.ano===fAno),[rateio,fMes,fAno]);
  const aReceber  = useMemo(()=>rateioMes.filter(r=>r.titular==="eu"    &&r.status==="pendente").reduce((s,r)=>s+r.valorTotal/2,0),[rateioMes]);
  const aPagar    = useMemo(()=>rateioMes.filter(r=>r.titular==="colega"&&r.status==="pendente").reduce((s,r)=>s+r.valorTotal/2,0),[rateioMes]);
  const gastoMeu  = useMemo(()=>rateioMes.filter(r=>r.titular==="colega"&&r.status==="pago"   ).reduce((s,r)=>s+r.valorTotal/2,0),[rateioMes]);

  const totalParcelasPagas = useMemo(()=>parcelasMes.filter(p=>p.pago).reduce((s,p)=>s+p.valorParcela,0),[parcelasMes]);
  const totalParcelasPend  = useMemo(()=>parcelasMes.filter(p=>!p.pago).reduce((s,p)=>s+p.valorParcela,0),[parcelasMes]);
  const totalComprasMes    = useMemo(()=>comprasMes.reduce((s,p)=>s+p.valorParcela,0),[comprasMes]);

  const totalGasto   = totalGastosPessoais+totalParcelasPagas+gastoMeu+totalComprasMes;
  const aReceberTot  = aReceber+totalParcelasPend;
  const recebida     = rateioMes.filter(r=>r.titular==="eu"&&r.status==="pago").reduce((s,r)=>s+r.valorTotal/2,0)+totalParcelasPagas;

  const catData = useMemo(()=>{
    const m={};
    gastosMes.forEach(g=>{m[g.categoria]=(m[g.categoria]||0)+g.valor;});
    comprasMes.forEach(p=>{m[p.categoria]=(m[p.categoria]||0)+p.valorParcela;});
    return Object.entries(m).map(([cat,val])=>({cat,val})).sort((a,b)=>b.val-a.val);
  },[gastosMes,comprasMes]);

  /* ── Actions ── */
  const addGasto=useCallback(async g=>{const r=await fadd("gastos",g);setGastos(p=>[...p,{...g,id:r.id}]);showToast("✓ Gasto adicionado","success");},[]);
  const delGasto=useCallback(async id=>{await fdel("gastos",id);setGastos(p=>p.filter(g=>g.id!==id));showToast("Gasto removido");},[]);
  const addCompra=useCallback(async c=>{const r=await fadd("compras_proprias",c);setCompras(p=>[...p,{...c,id:r.id}]);showToast("✓ Compra parcelada cadastrada","success");},[]);
  const delCompra=useCallback(async id=>{await fdel("compras_proprias",id);setCompras(p=>p.filter(c=>c.id!==id));showToast("Compra removida");},[]);

  const addCartao=useCallback(async c=>{const r=await fadd("cartoes",c);setCartoes(p=>[...p,{...c,id:r.id}]);showToast("✓ Empréstimo adicionado","success");},[]);
  const delCartao=useCallback(async id=>{await fdel("cartoes",id);setCartoes(p=>p.filter(c=>c.id!==id));},[]);
  const toggleParcela=useCallback(async(cId,num,pago)=>{
    const c=cartoes.find(x=>x.id===cId);if(!c)return;
    const np={...(c.pagamentos||{}),[num]:!pago};
    await fpatch("cartoes",cId,{pagamentos:np});
    setCartoes(p=>p.map(x=>x.id!==cId?x:{...x,pagamentos:np}));
    showToast(!pago?"✓ Marcado como pago":"↩ Revertido para pendente",!pago?"success":"warn");
  },[cartoes]);

  const addRateio=useCallback(async r=>{const ref=await fadd("rateio",r);setRateio(p=>[...p,{...r,id:ref.id}]);showToast("✓ Conta adicionada","success");},[]);
  const delRateio=useCallback(async id=>{await fdel("rateio",id);setRateio(p=>p.filter(r=>r.id!==id));},[]);
  const toggleRateio=useCallback(async id=>{
    const r=rateio.find(x=>x.id===id);if(!r)return;
    const ns=r.status==="pago"?"pendente":"pago";
    await fpatch("rateio",id,{status:ns});
    setRateio(p=>p.map(x=>x.id!==id?x:{...x,status:ns}));
    showToast(ns==="pago"?"✓ Pago":"↩ Pendente",ns==="pago"?"success":"warn");
  },[rateio]);

  const addSaldo=useCallback(async s=>{const r=await fadd("saldos",s);setSaldos(p=>[...p,{...s,id:r.id}]);showToast("✓ Conta cadastrada","success");},[]);
  const delSaldo=useCallback(async id=>{await fdel("saldos",id);setSaldos(p=>p.filter(s=>s.id!==id));},[]);
  const addMov=useCallback(async(m)=>{
    const r=await fadd("movimentos",m);
    setMovs(p=>[...p,{...m,id:r.id}]);
    const delta=m.tipo==="entrada"?m.valor:-m.valor;
    const ns=saldos.map(s=>s.id===m.contaId?{...s,saldoAtual:s.saldoAtual+delta}:s);
    setSaldos(ns);
    await fpatch("saldos",m.contaId,{saldoAtual:(saldos.find(s=>s.id===m.contaId)?.saldoAtual||0)+delta});
    showToast("✓ Lançamento registrado","success");
  },[saldos]);
  const delMov=useCallback(async(id,contaId,tipo,valor)=>{
    await fdel("movimentos",id);
    setMovs(p=>p.filter(m=>m.id!==id));
    const delta=tipo==="entrada"?-valor:valor;
    const ns=saldos.map(s=>s.id===contaId?{...s,saldoAtual:s.saldoAtual+delta}:s);
    setSaldos(ns);
    await fpatch("saldos",contaId,{saldoAtual:(saldos.find(s=>s.id===contaId)?.saldoAtual||0)+delta});
    showToast("Lançamento removido");
  },[saldos]);

  /* ── Tabs ── */
  const TABS=[
    {id:"saldo",    emoji:"💎", label:"Saldo"},
    {id:"overview", emoji:"📊", label:"Visão Geral"},
    {id:"gastos",   emoji:"🧾", label:"Gastos"},
    {id:"cartao",   emoji:"💳", label:"Cartão Emp."},
    {id:"rateio",   emoji:"🏠", label:"Rateio Apê"},
  ];

  if(loading) return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16}},
    h("div",{style:{fontSize:32}},"⚡"),
    h("div",{style:{fontSize:14,color:"var(--muted)",fontFamily:"var(--font-head)"}},"Conectando ao Firebase…")
  );

  return h("div",{style:{minHeight:"100vh",background:"var(--bg)"}},
    /* HEADER */
    h("div",{style:{background:"linear-gradient(180deg,#0d1421,var(--bg1))",borderBottom:"1px solid var(--border)",padding:"16px 28px 0",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(12px)"}},
      h("div",{style:{maxWidth:1100,margin:"0 auto"}},
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
          h("div",{style:{display:"flex",alignItems:"center",gap:12}},
            h("div",{style:{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#4f8eff,#7b5ea7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,boxShadow:"0 0 20px #4f8eff40"}},"💰"),
            h("div",null,
              h("div",{style:{fontSize:16,fontWeight:800,color:"var(--text)",fontFamily:"var(--font-head)",letterSpacing:"-.5px"}},"FinanceOS"),
              h("div",{style:{fontSize:10.5,color:"var(--muted)"}},"Personal Finance Dashboard")
            )
          ),
          h("div",{style:{display:"flex",alignItems:"center",gap:8}},
            h("span",{style:{fontSize:11,color:"var(--muted)",marginRight:2}},"Período:"),
            h(BigSel,{value:fMes,onChange:setFMes,options:MESES.map((l,v)=>({v,l}))}),
            h(BigSel,{value:fAno,onChange:setFAno,options:[CY-2,CY-1,CY,CY+1].map(y=>({v:y,l:String(y)}))})
          )
        ),
        h("div",{style:{display:"flex",gap:1,overflowX:"auto"}},
          TABS.map(t=>h("button",{key:t.id,onClick:()=>setTab(t.id),style:{
            display:"flex",alignItems:"center",gap:6,padding:"9px 16px",whiteSpace:"nowrap",
            borderRadius:"8px 8px 0 0",border:"none",cursor:"pointer",
            background:tab===t.id?"var(--bg)":"transparent",
            color:tab===t.id?"var(--accent)":"var(--muted)",
            fontWeight:tab===t.id?700:400,fontSize:13,fontFamily:"var(--font-body)",
            borderTop:`2px solid ${tab===t.id?"var(--accent)":"transparent"}`,
            transition:"all .15s",
          }},t.emoji," ",t.label))
        )
      )
    ),

    /* CONTENT */
    h("div",{style:{maxWidth:1100,margin:"0 auto",padding:"28px 28px 60px"}},
      tab==="saldo"    && h(SaldoTab,{gastosMes,parcelasMes,rateioMes,comprasMes,fMes,fAno,saldos,onAddSaldo:addSaldo,onDelSaldo:delSaldo,onAddMov:addMov,onDelMov:delMov,movimentos:movs}),
      tab==="overview" && h(OverviewTab,{totalGasto,aReceber:aReceberTot,aPagar,recebida,catData,gastosMes,parcelasMes,rateioMes,comprasMes,fMes,fAno}),
      tab==="gastos"   && h(GastosTab,{gastosMes,comprasMes,fMes,fAno,onAddGasto:addGasto,onDelGasto:delGasto,onAddCompra:addCompra,onDelCompra:delCompra,totalGastos:totalGastosPessoais,totalCompras:totalComprasMes}),
      tab==="cartao"   && h(CartaoTab,{cartoes,parcelasMes,fMes,fAno,onToggle:toggleParcela,onAdd:addCartao,onDel:delCartao}),
      tab==="rateio"   && h(RateioTab,{rateioMes,fMes,fAno,onToggle:toggleRateio,onAdd:addRateio,onDel:delRateio,aReceber,aPagar,gastoMeu})
    )
  );
}

/* ══ Boot ══ */
signInAnonymously(auth).catch(()=>{});
onAuthStateChanged(auth,()=>{
  RD.createRoot(document.getElementById("root")).render(R.default.createElement(App,null));
});
</script>
</body>
</html>
